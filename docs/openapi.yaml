      description: |
        **UI notes:** Send revision starting at one and increment it for each new edit. Send only fields that changed. Send selectedOptionIds for choice questions or writtenAnswer for written answers. An accepted false response means the stored revision is newer or equal. Use the returned revision and savedAt to confirm saves. Send cumulative keystroke and paste counts. A 409 means no more changes can be saved.
      requestBody:
        required: true
