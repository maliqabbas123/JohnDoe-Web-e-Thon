  /attempts/{id}/submit:
    parameters:
      - { $ref: "#/components/parameters/AttemptId" }
    post:
      tags: [Attempts]
      operationId: submitCandidateAttempt
      summary: Submit an attempt and score objective answers
      description: |
        **UI notes:** Flush pending saves before submitting. The response can be SUBMITTED or EXPIRED. Retrying returns the same submission state and timestamp. Written answers appear in the examiner’s grading queue.
      responses:
        "200":
          description: Submit an attempt and score objective answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitCandidateAttemptResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
