  /exams/{id}/sandbox:
    parameters:
      - { $ref: "#/components/parameters/ExamId" }
    post:
      tags: [Attempts]
      operationId: startExamSandbox
      summary: Preview the exam as a candidate
      description: |
        **UI notes:** Owners can preview a draft with a complete paper. The preview has its own deadline and uses the candidate attempt routes. A 200 resumes an open preview. A 409 means the paper is incomplete.
      responses:
        "200":
          description: Preview the exam as a candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateAttemptStartResponse" }
        "201":
          description: Preview the exam as a candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateAttemptStartResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CandidateAttemptConflict" }
    delete:
      tags: [Attempts]
      operationId: resetExamSandbox
      summary: Reset an examiner’s exam preview
      description: |
        **UI notes:** Discard the examiner’s preview attempts for this exam. A 204 response has no body.
      responses:
        "204":
          description: Reset an examiner’s exam preview.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/overview:
    get:
      tags: [Admin]
      operationId: getPlatformOverview
      summary: Platform-wide counts
      description: |
        Administrator only. Counts for a dashboard: users, examinations,
        attempts, open disputes, active sessions and failed sign-ins.

        **UI notes:**
        - Every value is a number except `serverTime`. There are no names or
          examination details here by design.
        - `exams.ongoing` and `exams.upcoming` are subsets of `exams.published`.
          Do not add them to it.
        - `attempts.interrupted` is a subset of `attempts.inProgress`.
        - Refresh on a timer of 30 seconds or more, not faster.
      responses:
        "200":
          description: Current counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlatformOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Audit log
      description: |
        Administrator only. A read-only record of sensitive actions, newest
        first. Entries cannot be created, changed or removed through the API.

        **UI notes:**
        - `actor` is `null` for actions with no signed-in user, such as a
          failed sign-in for an unknown email.
        - `metadata` differs by action. Render it as key and value pairs rather
          than assuming fields. It never contains a password.
        - `from` and `to` must be full ISO 8601 times **with a time zone**
          (`2026-11-27T00:00:00Z` or `...+05:00`). A date alone returns 422.
        - `action` is matched exactly, ignoring case.
        - **Paging is by cursor, not page number**, because the log grows
          without bound. Request the first page with no `cursor`. To load more,
          send `meta.nextCursor` back as `cursor` with the same filters.
          `nextCursor: null` means there is nothing more. Build a "Load more"
          button or infinite scroll, not numbered pages; you cannot jump to
          page N.
        - `meta.total` is absent unless you send `withTotal=true`, and then it
          comes on the first page only. Counting is the slowest part of the
          request, so ask for it only if the screen shows a result count, and
          keep the value in state while loading more.
        - Treat the cursor as opaque. Do not build or change one.
      parameters:
        - name: cursor
          in: query
          description: The `meta.nextCursor` value from the previous page. Omit for the first page.
          schema: { type: string, maxLength: 200 }
        - { $ref: "#/components/parameters/PageSize" }
        - name: withTotal
          in: query
          description: Send `true` to receive `meta.total` on the first page.
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: actorId
          in: query
          description: Id of the user who performed the action.
          schema: { type: string, maxLength: 64 }
        - name: action
          in: query
          description: Action name, for example `LOGIN_FAILED`.
          schema: { $ref: "#/components/schemas/AuditAction" }
        - name: entityType
          in: query
          description: Kind of record affected, for example `User`.
          schema: { type: string, maxLength: 64 }
        - name: entityId
          in: query
          description: Id of the record affected.
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: Earliest time, inclusive.
          schema: { $ref: "#/components/schemas/Instant" }
        - name: to
          in: query
          description: Latest time, inclusive. Must not be before `from`.
          schema: { $ref: "#/components/schemas/Instant" }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attempts/{id}/heartbeat:
    post:
      tags: [Monitoring]
      operationId: sendHeartbeat
      summary: Report contact and receive announcements
      description: |
        Candidate only, for their own non-sandbox attempt. A gap of more than
        45 seconds is recorded as a disruption. The deadline stays fixed.

        **UI notes:** Send every 15 seconds while the attempt is live. Use the
        returned server time and fixed deadline for the countdown. Send the
        last announcementCursor as cursor. If hasMoreAnnouncements is true,
        fetch the next page immediately. Stop when status is SUBMITTED or
        EXPIRED. An elapsed attempt is finalized from its last saved answers.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
        - { $ref: "#/components/parameters/AnnouncementCursor" }
      responses:
        "200":
          description: Current attempt timing and up to 20 announcements.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Heartbeat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attempts/{id}/incidents:
    post:
      tags: [Monitoring]
      operationId: recordClientIncidents
      summary: Report a batch of exam-page signals
      description: |
        Candidate only, for their own live non-sandbox attempt. The server
        sets source to CLIENT, severity to LOW and records its receive time.

        **UI notes:** Send only documented client events and their declared
        details. Fullscreen, clipboard, context menu and extra-display events
        require the corresponding switch. The whole batch is rejected if
        any event is invalid. Send at most 20 events per request and 12
        requests per candidate per 60 seconds. On 429 use Retry-After.
        Stop sending when the attempt closes.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [incidents]
              properties:
                incidents:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: "#/components/schemas/ClientIncident" }
            example:
              incidents:
                - { type: TAB_HIDDEN, details: { awayMs: 1200 } }
                - { type: COPY_ATTEMPT, details: { position: 3 } }
      responses:
        "201":
          description: Number of events recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accepted]
                    properties:
                      accepted: { type: integer, minimum: 1, maximum: 20 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The attempt has been submitted or its deadline has elapsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /exams/{id}/monitor:
    get:
      tags: [Monitoring]
      operationId: getExamMonitor
      summary: Monitor attempts for your exam
      description: |
        Examiner only, own exam. Reports aggregate progress and signal counts
        for non-sandbox attempts and records new contact gaps it observes.

        **UI notes:** Poll every few seconds. Display attempt status before
        connection state. A disruption is evidence of lost contact. Use
        meta.nextCursor to load additional rows in attempt ID order.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: A page of attempts and the snapshot time.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MonitoredAttempt" }
                  meta:
                    type: object
                    required: [pageSize, nextCursor, serverTime]
                    properties:
                      pageSize: { type: integer, minimum: 1, maximum: 200 }
                      nextCursor: { type: [string, "null"] }
                      serverTime: { $ref: "#/components/schemas/Instant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /exams/{id}/announcements:
    parameters:
      - { $ref: "#/components/parameters/ExamId" }
    get:
      tags: [Monitoring]
      operationId: listExamAnnouncements
      summary: List announcements for your exam
      description: |
        Examiner only, own exam.

        **UI notes:** Messages are in delivery order. Send meta.nextCursor
        as cursor for the next page. Render messages as plain text.
      parameters:
        - { $ref: "#/components/parameters/AnnouncementCursor" }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of announcements.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExamAnnouncement" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Monitoring]
      operationId: sendExamAnnouncement
      summary: Send an announcement to candidates in your exam
      description: |
        Examiner only, own exam.

        **UI notes:** Send 1 to 1,000 characters of plain text. Candidates
        receive the announcement through their next heartbeat for this exam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: The announcement to display in the history.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ExamAnnouncement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attempts/{id}/integrity:
    get:
      tags: [Integrity]
      operationId: getAttemptIntegrity
      summary: Read integrity signals for a closed attempt
      description: |
        Examiner only, for an exam they own. The read analyzes the frozen
        submission and records newly observed server signals once.

        **UI notes:** Show the level and counts as signals for review. Use
        nextCursor to page signals. Totals cover the whole attempt. A live
        attempt returns 409. Sandbox and foreign attempts return 404.

        Fast answers are evaluated on hard objective questions within five
        seconds. Typing-count comparisons require a written answer with
        length and typing evidence and the clipboard switch enabled.
        Similarity samples up to 200 other candidates' latest closed attempts
        and 4,000 answer records, comparing the same frozen questions.
        Written comparisons use the first 2,000 characters and require at least
        80 characters and 12 words. Matching wrong selections require at least
        three common questions. The response omits answer text and markers.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 64 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Signals for review and the saved examiner note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IntegritySummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AttemptOpenForGrading" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attempts/{id}/integrity/review:
    put:
      tags: [Integrity]
      operationId: saveAttemptIntegrityReview
      summary: Save an integrity review note
      description: |
        Examiner only, for a closed attempt in their own exam.

        **UI notes:** Send a note of up to 2,000 characters. The response
        records the author and server time. A new save replaces the note.
        Review notes are private to the examiner.
      parameters:
        - { $ref: "#/components/parameters/AttemptId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Saved note and reviewer.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IntegrityReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AttemptOpenForGrading" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /exams/{id}/grading:
    get:
      tags: [Grading]
      operationId: listGradingQueue
      summary: List written answers awaiting a mark
      description: |
        Examiner only, for an exam they own. Includes written responses from
        submitted and expired attempts, including blank responses. Entries
        are ordered by oldest submission first.

        **UI notes:** Open the attempt review using `attemptId`, then go to
        `position`. Use `meta.nextCursor` to load more, or reload the first
        page after grading. An empty page with a null cursor means there are
        no more answers. Sandbox previews are excluded.
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/PageSize"
        - name: cursor
          in: query
          description: Send back the previous page's nextCursor unchanged.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: One page of ungraded written answers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GradingQueueItem" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attempts/{id}/review:
    get:
      tags: [Grading]
      operationId: reviewAttempt
      summary: Review a closed submission
      description: |
        Examiner only, for an exam they own. Returns the frozen paper,
        answers, objective answer key and current marks.

        **UI notes:** Display the returned question and option order. A null
        total means some answers are waiting for a mark. Do not cache or show
        this response in candidate views. A live attempt returns `409`.
        Sandbox previews and attempts from other examiners return `404`.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Frozen paper, answers and latest grade.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GradingReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AttemptOpenForGrading" }

  /attempts/{id}/answers/{position}/grade:
    patch:
      tags: [Grading]
      operationId: gradeAnswer
      summary: Save a mark and feedback on a written answer
      description: |
        Examiner only, for a closed submission in an exam they own. Updates
        the mark and recalculates the attempt's total in one transaction.
        Changing a released score also supersedes any active issued report.

        **UI notes:** Send a numeric `score` between zero and the answer's
        `marks`, with at most two decimals. Omit `feedback` to keep it or
        send null to clear it. Show the `reason` field when changing a mark
        after release. An unchanged mark can be saved without a reason.
        Use the returned `attempt` and `answer` to update the view. A
        `409` means the attempt is still open. A `422` identifies an invalid
        position, non-written question, bad mark or missing reason.
      parameters:
        - $ref: "#/components/parameters/AttemptId"
        - name: position
          in: path
          required: true
          description: The one-based position from the attempt review.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeAnswerInput" }
            example: { score: 2.25, feedback: Correct result. Show your working. }
      responses:
        "200":
          description: Saved answer grade and recalculated attempt total.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [attempt, answer]
                    properties:
                      attempt: { $ref: "#/components/schemas/AttemptGrade" }
                      answer:
                        type: object
                        required: [position, manualScore, feedback, gradedAt]
                        properties:
                          position: { type: integer, minimum: 1 }
                          manualScore: { type: number, minimum: 0, multipleOf: 0.01 }
                          feedback: { type: [string, "null"] }
                          gradedAt: { $ref: "#/components/schemas/Instant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AttemptOpenForGrading" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /exams/{id}/results:
    get:
      tags: [Results]
      operationId: listExamResults
      summary: List the result for each enrolled candidate
      description: |
        Examiner only, for an exam they own. Selects each candidate's highest
        fully graded score with the earliest attempt number breaking a tie
        under BEST, or their latest fully graded attempt under LATEST.

        **UI notes:** A candidate without a fully graded attempt shows their
        latest closed attempt, or a null result if they have never submitted.
        A null release time means the selected attempt is private. Page by
        candidate id using `meta.nextCursor`.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: cursor
          in: query
          description: The next cursor returned by the previous page.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: List the result for each enrolled candidate.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExamCandidateResult" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /exams/{id}/results/release:
    post:
      tags: [Results]
      operationId: releaseExamResults
      summary: Release current fully graded results
      description: |
        Examiner only, for an exam they own. The release applies to the
        policy-selected attempt of each candidate. It preserves timestamps for
        results that were already released.

        **UI notes:** Send no body. Show the `released` and `alreadyReleased`
        result counts. `needsReview` counts closed attempts still waiting for
        marks, which this call skips. A candidate can have an older eligible
        result and a newer attempt waiting for review. A null release time in
        the response means this call published zero results.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: Release current fully graded results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResultRelease" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/results:
    get:
      tags: [Results]
      operationId: listMyResults
      summary: List the candidate's released results
      description: |
        Candidate only. Shows one released result per exam, selected under
        the exam's result policy from the candidate's released attempts.

        **UI notes:** An eligible private retake leaves the prior released
        result visible. Page newest release first using `meta.nextCursor`
        and open the detail using the returned `attemptId`.
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - name: cursor
          in: query
          description: The next cursor returned by the previous page.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: List the candidate's released results.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CandidateResult" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/results/{attemptId}:
    get:
      tags: [Results]
      operationId: getMyResult
      summary: Read a released result and review the submitted answers
      description: |
        Candidate only. Accessible for their own released attempts, including
        results superseded by a later release. Other candidates' results,
        private attempts and sandbox attempts return 404.

        **UI notes:** Render questions and options in the supplied order. Use
        `answerKey` only when present. It appears for objective questions
        when the examiner enables answer reveal. The question and its answer
        key come from the frozen attempt.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Read a released result and review the submitted answers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CandidateResultReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exams/{id}/analytics:
    get:
      tags: [Results]
      operationId: getExamAnalytics
      summary: Read score statistics and paper fairness
      description: |
        Examiner only, for an exam they own. Score statistics use one fully
        graded result per candidate according to the exam's policy, including
        private results. Distribution buckets use percentages, with an
        exclusive upper bound except for the final bucket, which includes 100.

        **UI notes:** Use `fairness.meta.nextCursor` to page papers. Each paper
        is assessed using scores from other attempts on each question, weighted
        by its marks. Difficulty is one minus the expected mark fraction.
        At least three other scores on every question are required. A flag
        means the paper differs from the mean of other comparable papers by
        at least 0.15 on the zero-to-one scale. Missing evidence yields a
        null value or flag. The report leaves scores untouched.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: cursor
          in: query
          description: The next cursor returned by the previous page.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Read score statistics and paper fairness.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ExamAnalytics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /exams/{id}/analytics/questions:
    get:
      tags: [Results]
      operationId: listQuestionAnalytics
      summary: Read per-question statistics for an exam
      description: |
        Examiner only, for an exam they own. Counts appearances on closed
        attempts, including attempts waiting for written grades.

        **UI notes:** `correctRate` divides correct answers by all servings.
        Written questions have null correctness and wrong-option statistics.
        Average time includes unopened questions. The label and text come from
        the most recent served snapshot. Observed difficulty uses mean mark
        fraction across scored answers, with EASY at 0.70 or above, MEDIUM
        at 0.40 or above, and HARD below 0.40. Wrong-option counts exclude
        accepted options and voided versions. Use `meta.nextCursor` to page.
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: cursor
          in: query
          description: The next cursor returned by the previous page.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Read per-question statistics for an exam.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/QuestionAnalytics" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: exam_session
      description: Set by sign-in and sign-up. Sent automatically by the browser when requests include credentials.

  headers:
    SessionCookie:
      description: >-
        The session cookie: `exam_session=<token>; HttpOnly; Path=/; Expires=<8 hours>`,
        with `Secure` in production. `SameSite` is `Lax`, or `None` when the API
        is configured for a UI on another origin.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer, minimum: 1 }

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: id
      in: path
      required: true
      description: The user's id.
      schema: { type: string, maxLength: 64 }
    TopicId:
      name: id
      in: path
      required: true
      description: The topic's id.
      schema: { type: string, maxLength: 64 }
    QuestionId:
      name: id
      in: path
      required: true
      description: The question's id.
      schema: { type: string, maxLength: 64 }

    ExamId:
      name: id
      in: path
      required: true
      description: The exam's id.
      schema: { type: string, maxLength: 64 }
    AnnouncementCursor:
      name: cursor
      in: query
      description: Opaque announcement position from the previous response.
      schema: { type: string, minLength: 1, maxLength: 200 }
    AttemptId:
      name: id
      in: path
      required: true
      description: The attempt's id.
      schema: { type: string, maxLength: 64 }

    EnrolmentCandidateId:
      name: candidateId
      in: path
      required: true
      description: Candidate ID from the exam roster.
      schema: { type: string, maxLength: 64 }
    EnrolmentPageNumber:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    EnrolmentPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    CandidateQuestionPosition:
      name: position
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 999 }

  responses:
    CandidateAttemptConflict:
      description: The attempt has closed, its slot is unavailable, or the paper cannot be served.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EnrolmentConflict:
      description: The candidate has already attempted this exam.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EnrolmentPayloadTooLarge:
      description: The enrolment request is larger than 128 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExamConflict:
      description: The current exam state or mode prevents this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The body is not valid JSON, is empty, or the request contains an invalid character.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session. Send the user to sign-in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: UNAUTHENTICATED, message: Sign in to continue. }
    Forbidden:
      description: The signed-in user's role does not allow this, or the request came from an origin that is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do this. }
    ForbiddenOrigin:
      description: The request came from an origin that is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record, or it is not visible to this user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AttemptOpenForGrading:
      description: The attempt is still in progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request exceeds the byte or row limit for this operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: One or more fields are invalid, or the request has a field the API does not accept.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Some fields are invalid.
              details:
                - { path: email, message: Enter a valid email address. }
    RateLimited:
      description: Too many attempts. Wait for the number of seconds in `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Instant:
      type: string
      format: date-time
      description: ISO 8601 time in UTC.
      examples: ["2026-11-27T08:30:00.000Z"]

    Role:
      type: string
      enum: [ADMIN, EXAMINER, CANDIDATE]
      description: The user type. Decides which area of the UI the user sees.

    Email:
      type: string
      format: email
      maxLength: 254
      description: Case-insensitive. Surrounding spaces are removed and it is stored in lower case.

    Name:
      type: string
      minLength: 1
      maxLength: 120
      description: Display name. Surrounding spaces are removed; it cannot be blank.

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      format: password
      description: 8 to 128 characters. There are no rules about character types; length is what matters.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - VALIDATION_FAILED
                - RATE_LIMITED
                - INTERNAL
              description: Stable identifier. Switch on this, not on the message.
            message:
              type: string
              description: Safe to show to the user.
            details:
              type: array
              description: Present for VALIDATION_FAILED.
              items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Field name. Empty when the problem is with the request as a whole.
        message:
          type: string

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          minimum: 0
          description: Number of items matching the filters, across all pages.

    CursorMeta:
      type: object
      required: [pageSize, nextCursor]
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        nextCursor:
          type: [string, "null"]
          description: Send as `cursor` to get the next page. Null when there are no more items.
        total:
          type: integer
          minimum: 0
          description: Number of items matching the filters. Present only on the first page, and only when `withTotal=true` was sent.

    SessionUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, expiresAt]
          properties:
            user: { $ref: "#/components/schemas/SessionUser" }
            expiresAt:
              allOf: [{ $ref: "#/components/schemas/Instant" }]
              description: When the session ends if nothing ends it sooner.

    User:
      type: object
      required: [id, email, name, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        isActive:
          type: boolean
          description: False means the user cannot sign in.
        createdAt: { $ref: "#/components/schemas/Instant" }
        updatedAt: { $ref: "#/components/schemas/Instant" }

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        password: { $ref: "#/components/schemas/NewPassword" }
        role:
          type: string
          enum: [CANDIDATE, EXAMINER]
          description: Upper case. ADMIN is not accepted.

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 128, format: password }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, format: password }
        newPassword: { $ref: "#/components/schemas/NewPassword" }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, role, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }
        password: { $ref: "#/components/schemas/NewPassword" }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        password:
          allOf: [{ $ref: "#/components/schemas/NewPassword" }]
          description: Sets a new password for the user and signs them out everywhere.

    PlatformOverview:
      type: object
      required: [serverTime, users, exams, attempts, disputes, sessions, security]
      properties:
        serverTime: { $ref: "#/components/schemas/Instant" }
        users:
          type: object
          required: [total, active, inactive, administrators, examiners, candidates]
          properties:
            total: { type: integer }
            active: { type: integer }
            inactive: { type: integer }
            administrators: { type: integer }
            examiners: { type: integer }
            candidates: { type: integer }
        exams:
          type: object
          required: [draft, published, upcoming, ongoing, completed]
          properties:
            draft: { type: integer }
            published: { type: integer }
            upcoming: { type: integer, description: Published and not yet started. Included in published. }
            ongoing: { type: integer, description: Published and inside its time slot now. Included in published. }
            completed: { type: integer }
        attempts:
          type: object
          required: [inProgress, interrupted, submitted, expired]
          properties:
            inProgress: { type: integer }
            interrupted: { type: integer, description: In progress with no recent contact. Included in inProgress. }
            submitted: { type: integer }
            expired: { type: integer, description: Closed by the server at the deadline. }
        disputes:
          type: object
          required: [open]
          properties:
            open: { type: integer }
        sessions:
          type: object
          required: [active]
          properties:
            active: { type: integer, description: Users signed in right now. }
        security:
          type: object
          required: [failedSignInsLast24Hours]
          properties:
            failedSignInsLast24Hours: { type: integer }

    GradingCandidate:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    GradingQueueItem:
      type: object
      required: [attemptId, position, submittedAt, marks, candidate]
      properties:
        attemptId: { type: string }
        position: { type: integer, minimum: 1 }
        submittedAt: { $ref: "#/components/schemas/Instant" }
        marks: { type: number, minimum: 0, multipleOf: 0.01 }
        candidate: { $ref: "#/components/schemas/GradingCandidate" }

    GradeValue:
      type: [number, "null"]
      minimum: 0
      multipleOf: 0.01
      description: Null when the score has not been set.

    AttemptGrade:
      type: object
      required: [id, gradingStatus, score]
      properties:
        id: { type: string }
        gradingStatus: { type: string, enum: [NEEDS_REVIEW, GRADED] }
        score: { $ref: "#/components/schemas/GradeValue" }

    GradingReview:
      allOf:
        - $ref: "#/components/schemas/AttemptGrade"
        - type: object
          required: [exam, candidate, attemptNumber, status, submittedAt, maxScore, resultReleasedAt, questions]
          properties:
            exam:
              type: object
              required: [id, title]
              properties:
                id: { type: string }
                title: { type: string }
            candidate: { $ref: "#/components/schemas/GradingCandidate" }
            attemptNumber: { type: integer, minimum: 1 }
            status: { type: string, enum: [SUBMITTED, EXPIRED] }
            submittedAt: { $ref: "#/components/schemas/Instant" }
            maxScore: { type: number, minimum: 0, multipleOf: 0.01 }
            resultReleasedAt: { type: [string, "null"], format: date-time }
            questions:
              type: array
              items: { $ref: "#/components/schemas/GradingReviewQuestion" }

    GradingReviewQuestion:
      type: object
      required: [position, type, difficulty, topic, text, options, alsoAccepted, voided, marks, selectedOptionIds, writtenAnswer, autoScore, manualScore, score, feedback, gradedAt]
      properties:
        position: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/QuestionType" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        topic:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        text: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, text, isCorrect]
            properties:
              id: { type: string }
              text: { type: string }
              isCorrect: { type: boolean }
        alsoAccepted:
          description: Additional sets of option ids accepted as correct following a dispute.
          type: array
          items:
            type: array
            items: { type: string }
        voided: { type: boolean }
        marks: { type: number, minimum: 0, multipleOf: 0.01 }
        selectedOptionIds:
          type: array
          items: { type: string }
        writtenAnswer: { type: [string, "null"] }
        autoScore: { $ref: "#/components/schemas/GradeValue" }
        manualScore: { $ref: "#/components/schemas/GradeValue" }
        score: { $ref: "#/components/schemas/GradeValue" }
        feedback: { type: [string, "null"] }
        gradedAt: { type: [string, "null"], format: date-time }

    GradeAnswerInput:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Also limited by the question's marks.
        feedback: { type: [string, "null"], maxLength: 5000 }
        reason: { type: string, minLength: 1, maxLength: 1000, description: Required for changing a released mark. }

    ExamCandidateResult:
      type: object
      required: [candidate, result]
      properties:
        candidate: { $ref: "#/components/schemas/GradingCandidate" }
        result:
          anyOf:
            - $ref: "#/components/schemas/ExamAttemptResult"
            - type: "null"

    ExamAttemptResult:
      type: object
      required: [attemptId, attemptNumber, status, gradingStatus, submittedAt, score, maxScore, resultReleasedAt]
      properties:
        attemptId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [SUBMITTED, EXPIRED] }
        gradingStatus: { type: string, enum: [PENDING, NEEDS_REVIEW, GRADED] }
        submittedAt: { $ref: "#/components/schemas/Instant" }
        score: { $ref: "#/components/schemas/GradeValue" }
        maxScore: { type: number }
        resultReleasedAt: { type: [string, "null"], format: date-time }

    ResultRelease:
      type: object
      required: [released, alreadyReleased, needsReview, releasedAt]
      properties:
        released: { type: integer, minimum: 0 }
        alreadyReleased: { type: integer, minimum: 0 }
        needsReview: { type: integer, minimum: 0 }
        releasedAt: { type: [string, "null"], format: date-time }

    CandidateResult:
      type: object
      required: [attemptId, attemptNumber, submittedAt, score, maxScore, resultReleasedAt, exam]
      properties:
        attemptId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        submittedAt: { $ref: "#/components/schemas/Instant" }
        score: { type: number }
        maxScore: { type: number }
        resultReleasedAt: { $ref: "#/components/schemas/Instant" }
        exam:
          type: object
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }

    CandidateResultReview:
      allOf:
        - $ref: "#/components/schemas/CandidateResult"
        - type: object
          required: [revealAnswers, questions]
          properties:
            revealAnswers: { type: boolean }
            questions:
              type: array
              items: { $ref: "#/components/schemas/CandidateResultQuestion" }

    CandidateResultQuestion:
      type: object
      required: [position, type, text, options, marks, score, selectedOptionIds, writtenAnswer, feedback]
      properties:
        position: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/QuestionType" }
        text: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        marks: { type: number }
        score: { $ref: "#/components/schemas/GradeValue" }
        selectedOptionIds:
          type: array
          items: { type: string }
        writtenAnswer: { type: [string, "null"] }
        feedback: { type: [string, "null"] }
        answerKey:
          type: object
          required: [correctOptionIds, alsoAccepted, voided]
          properties:
            correctOptionIds:
              type: array
              items: { type: string }
            alsoAccepted:
              type: array
              items:
                type: array
                items: { type: string }
            voided: { type: boolean }

    ExamAnalytics:
      type: object
      required: [scores, fairness]
      properties:
        scores:
          type: object
          required: [count, mean, median, min, max, distribution]
          properties:
            count: { type: integer, minimum: 0 }
            mean: { type: [number, "null"] }
            median: { type: [number, "null"] }
            min: { type: [number, "null"] }
            max: { type: [number, "null"] }
            distribution:
              type: array
              items:
                type: object
                required: [fromPercent, toPercent, count]
                properties:
                  fromPercent: { type: integer }
                  toPercent: { type: integer }
                  count: { type: integer, minimum: 0 }
        fairness:
          type: object
          required: [minimumOtherScores, outlierDistance, comparablePapers, papers, meta]
          properties:
            minimumOtherScores: { type: integer }
            outlierDistance: { type: number }
            comparablePapers: { type: integer }
            papers:
              type: array
              items: { $ref: "#/components/schemas/PaperFairness" }
            meta: { $ref: "#/components/schemas/CursorMeta" }

    PaperFairness:
      type: object
      required: [attemptId, questionCount, comparedQuestions, observedDifficulty, peerDifficulty, flag]
      properties:
        attemptId: { type: string }
        questionCount: { type: integer }
        comparedQuestions: { type: integer }
        observedDifficulty: { type: [number, "null"] }
        peerDifficulty: { type: [number, "null"] }
        flag: { type: [string, "null"], enum: [HARDER, EASIER, null] }

    QuestionAnalytics:
      type: object
      required: [questionId, text, labelledDifficulty, served, skipped, correct, correctRate, averageTimeSeconds, meanMarkFraction, observedDifficulty, mostChosenWrongOption]
      properties:
        questionId: { type: string }
        text: { type: string }
        labelledDifficulty: { $ref: "#/components/schemas/Difficulty" }
        served: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        correct: { type: [integer, "null"] }
        correctRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        averageTimeSeconds: { type: number }
        meanMarkFraction: { type: [number, "null"] }
        observedDifficulty: { type: [string, "null"], enum: [EASY, MEDIUM, HARD, null] }
        mostChosenWrongOption:
          type: [object, "null"]
          required: [id, text, count]
          properties:
            id: { type: string }
            text: { type: string }
            count: { type: integer }

    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_SELECT, WRITTEN]
      description: One correct option, one or more correct options, or a written response graded by the examiner.

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
      description: The examiner's label. Used to build papers of equal difficulty.

    Marks:
      type: number
      minimum: 0.25
      maximum: 1000
      multipleOf: 0.01
      description: A number with at most two decimal places.

    Topic:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { $ref: "#/components/schemas/Instant" }

    TopicWithCounts:
      allOf:
        - { $ref: "#/components/schemas/Topic" }
        - type: object
          required: [questionCount, byDifficulty]
          properties:
            questionCount: { type: integer, description: Active questions in the topic. }
            byDifficulty:
              type: object
              required: [EASY, MEDIUM, HARD]
              properties:
                EASY: { type: integer }
                MEDIUM: { type: integer }
                HARD: { type: integer }

    TopicRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    QuestionOption:
      type: object
      required: [id, text, isCorrect, position]
      properties:
        id: { type: string }
        text: { type: string }
        isCorrect: { type: boolean, description: Part of the answer key. Examiner only. }
        position: { type: integer, minimum: 1, description: Authoring order, starting at 1. }

    OptionInput:
      type: object
      additionalProperties: false
      required: [text, isCorrect]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        isCorrect: { type: boolean }

    Question:
      type: object
      required: [id, type, difficulty, text, explanation, defaultMarks, isArchived, createdAt, updatedAt, topic, options, usedInExams]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/QuestionType" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, description: May contain any characters. Escape it when rendering. }
        explanation: { type: [string, "null"], description: Model answer or marking guide. }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        isArchived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Instant" }
        updatedAt: { $ref: "#/components/schemas/Instant" }
        topic:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        options:
          type: array
          description: In authoring order. Empty for a written-response question.
          items: { $ref: "#/components/schemas/QuestionOption" }
        usedInExams: { type: integer, description: Number of exams whose pool includes this question. }

    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [topicId, type, difficulty, text, defaultMarks]
      properties:
        topicId: { type: string, maxLength: 64 }
        type: { $ref: "#/components/schemas/QuestionType" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, minLength: 1, maxLength: 5000 }
        explanation: { type: [string, "null"], maxLength: 5000 }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        options:
          type: array
          maxItems: 10
          description: Required for choice questions (2 to 10). Omit for written-response questions.
          items: { $ref: "#/components/schemas/OptionInput" }

    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topicId: { type: string, maxLength: 64 }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, minLength: 1, maxLength: 5000 }
        explanation: { type: [string, "null"], maxLength: 5000 }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        options:
          type: array
          maxItems: 10
          description: Replaces the whole option set.
          items: { $ref: "#/components/schemas/OptionInput" }
        isArchived: { type: boolean }

    ImportJob:
      type: object
      additionalProperties: false
      required: [id, kind, fileName, totalRows, successCount, failureCount, errors, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [QUESTIONS, CANDIDATES] }
        examId:
          type: [string, "null"]
          description: The target exam for a candidate import. Null if that exam was deleted.
        fileName: { type: string }
        totalRows: { type: integer, minimum: 1 }
        successCount: { type: integer, minimum: 0 }
        failureCount: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, field, message]
            properties:
              row: { type: integer, minimum: 1 }
              field: { type: string, examples: [topicId, options.0.text, row] }
              message: { type: string }
        createdAt: { $ref: "#/components/schemas/Instant" }

    WorkspacePreferencesInput:
      type: object
      additionalProperties: false
      properties:
        theme:
          type: string
          enum: [system, light, dark]
          default: system
          description: Use the browser color scheme when set to system.
        fontSize:
          type: integer
          minimum: 12
          maximum: 32
          default: 16
          description: Question text size in CSS pixels.
        lineSpacing:
          type: number
          minimum: 1
          maximum: 2
          multipleOf: 0.25
          default: 1.5
          description: Line-height multiplier for question text.
        palettePosition:
          type: string
          enum: [left, right]
          default: right
          description: Side of the exam workspace for the question navigation palette.

    WorkspacePreferences:
      allOf:
        - { $ref: "#/components/schemas/WorkspacePreferencesInput" }
        - required: [theme, fontSize, lineSpacing, palettePosition]

    ExamAnnouncement:
      type: object
      additionalProperties: false
      required: [id, message, createdAt]
      properties:
        id: { type: string }
        message: { type: string }
        createdAt: { $ref: "#/components/schemas/Instant" }

    MonitoredAttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, EXPIRED]

    Heartbeat:
      type: object
      additionalProperties: false
      required: [serverTime, deadlineAt, status, announcements, announcementCursor, hasMoreAnnouncements]
      properties:
        serverTime: { $ref: "#/components/schemas/Instant" }
        deadlineAt: { $ref: "#/components/schemas/Instant" }
        status: { $ref: "#/components/schemas/MonitoredAttemptStatus" }
        announcements:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ExamAnnouncement" }
        announcementCursor: { type: [string, "null"] }
        hasMoreAnnouncements: { type: boolean }

    MonitoredAttempt:
      type: object
      additionalProperties: false
      required: [id, candidate, attemptNumber, status, connection, lastSeenAt, deadlineAt, currentPosition, questionCount, answeredCount, incidentCount, disruptionCount, latestDisruption]
      properties:
        id: { type: string }
        candidate:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        attemptNumber: { type: integer }
        status: { $ref: "#/components/schemas/MonitoredAttemptStatus" }
        connection: { type: string, enum: [ONLINE, INTERRUPTED] }
        lastSeenAt: { $ref: "#/components/schemas/Instant" }
        deadlineAt: { $ref: "#/components/schemas/Instant" }
        currentPosition: { type: integer }
        questionCount: { type: integer }
        answeredCount: { type: integer }
        incidentCount: { type: integer }
        disruptionCount: { type: integer }
        latestDisruption:
          type: [object, "null"]
          required: [startedAt, endedAt]
          properties:
            startedAt: { $ref: "#/components/schemas/Instant" }
            endedAt: { type: [string, "null"], format: date-time }

    ClientIncident:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [TAB_HIDDEN, FOCUS_LOST] }
            details:
              type: object
              additionalProperties: false
              required: [awayMs]
              properties:
                awayMs: { type: integer, minimum: 0, maximum: 86400000 }
        - type: object
          additionalProperties: false
          required: [type, details]
          properties:
            type: { type: string, enum: [COPY_ATTEMPT, PASTE_ATTEMPT] }
            details:
              type: object
              additionalProperties: false
              required: [position]
              properties:
                position: { type: integer, minimum: 1, maximum: 2147483647 }
        - type: object
          additionalProperties: false
          required: [type, details]
          properties:
            type: { type: string, const: DEVTOOLS_SHORTCUT }
            details:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string, enum: [F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Meta+Alt+I, Meta+Alt+J, Meta+Alt+C] }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [FULLSCREEN_EXIT, CONTEXT_MENU, PRINT_SCREEN, EXTRA_DISPLAY] }

    IntegrityReview:
      type: object
      required: [note, reviewedById, reviewedAt]
      properties:
        note: { type: string }
        reviewedById: { type: [string, "null"] }
        reviewedAt: { $ref: "#/components/schemas/Instant" }

    IntegritySummary:
      type: object
      required: [attemptId, counts, level, review, signals, nextCursor]
      properties:
        attemptId: { type: string }
        counts:
          type: object
          required: [LOW, MEDIUM, HIGH]
          properties:
            LOW: { type: integer, minimum: 0 }
            MEDIUM: { type: integer, minimum: 0 }
            HIGH: { type: integer, minimum: 0 }
        level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        review:
          oneOf:
            - { $ref: "#/components/schemas/IntegrityReview" }
            - { type: "null" }
        nextCursor: { type: [string, "null"] }
        signals:
          type: array
          items:
            type: object
            required: [id, type, source, severity, details, createdAt, position, label]
            properties:
              id: { type: string }
              type: { type: string }
              source: { type: string, enum: [CLIENT, SERVER] }
              severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
              details: {}
              createdAt: { $ref: "#/components/schemas/Instant" }
              position: { type: [integer, "null"] }
              label: { type: string }

    UserActivity:
      type: object
      required: [sessions, signInLock, signIns, accountChanges]
      properties:
        sessions:
          type: array
          description: Active sessions, newest first. Never includes the session token.
          items:
            type: object
            required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent]
            properties:
              id: { type: string }
              createdAt: { $ref: "#/components/schemas/Instant" }
              lastSeenAt:
                allOf: [{ $ref: "#/components/schemas/Instant" }]
                description: Last request made with this session, accurate to about a minute.
              expiresAt: { $ref: "#/components/schemas/Instant" }
              ip: { type: [string, "null"] }
              userAgent: { type: [string, "null"], description: Browser identification. Show it as plain text. }
        signInLock:
          type: object
          required: [locked, until]
          properties:
            locked: { type: boolean }
            until:
              description: When the lock ends by itself. Null when not locked.
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
        signIns:
          type: array
          description: The 20 most recent sign-in attempts, newest first.
          items:
            type: object
            required: [id, succeeded, ip, createdAt]
            properties:
              id: { type: string }
              succeeded: { type: boolean }
              ip: { type: [string, "null"] }
              createdAt: { $ref: "#/components/schemas/Instant" }
        accountChanges:
          type: array
          description: The 20 most recent changes to the account, newest first.
          items:
            type: object
            required: [id, action, metadata, ip, createdAt, actor]
            properties:
              id: { type: string }
              action: { type: string, description: See AuditAction. }
              metadata: { type: [object, "null"], additionalProperties: true }
              ip: { type: [string, "null"] }
              createdAt: { $ref: "#/components/schemas/Instant" }
              actor:
                description: Who made the change. The user themselves for sign-up and password change.
                oneOf:
                  - { $ref: "#/components/schemas/SessionUser" }
                  - { type: "null" }

    ExamState:
      type: string
      enum: [DRAFT, PUBLISHED, ONGOING, COMPLETED]
      description: Calculated state. The published main slot is ongoing from its start through its end and complete once the end passes.
    ExamMarks:
      type: number
      minimum: 0.01
      maximum: 99999.99
      multipleOf: 0.01
    ExamPositiveInt:
      type: integer
      minimum: 1
      maximum: 2147483647
    ExamSettings:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, maxLength: 10000, default: "" }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        durationMinutes: { $ref: "#/components/schemas/ExamPositiveInt" }
        totalMarks: { $ref: "#/components/schemas/ExamMarks" }
        selectionMode: { type: string, enum: [FIXED, BALANCED], default: FIXED }
        shuffleQuestions: { type: boolean, default: false }
        shuffleOptions: { type: boolean, default: false }
        multiSelectScoring: { type: string, enum: [ALL_OR_NOTHING, PARTIAL], default: ALL_OR_NOTHING }
        maxAttempts:
          description: Null means unlimited.
          oneOf:
            - { $ref: "#/components/schemas/ExamPositiveInt" }
            - { type: "null" }
          default: 1
        resultPolicy: { type: string, enum: [BEST, LATEST], default: BEST }
        disputeWindowHours:
          description: Hours from result release. Null disables disputes.
          oneOf:
            - { $ref: "#/components/schemas/ExamPositiveInt" }
            - { type: "null" }
          default: 72
        revealAnswers: { type: boolean, default: false }
        desktopOnly: { type: boolean, default: true }
        blockClipboard: { type: boolean, default: true }
        blockContextMenu: { type: boolean, default: true }
        requireFullscreen: { type: boolean, default: false }
        detectExtraDisplay: { type: boolean, default: true }
        watermark: { type: boolean, default: true }
        aiNotice: { type: boolean, default: true }
        honeypot: { type: boolean, default: true }
    CreateExamRequest:
      allOf:
        - { $ref: "#/components/schemas/ExamSettings" }
      required: [title, startsAt, endsAt, durationMinutes, totalMarks]
      unevaluatedProperties: false
    UpdateExamRequest:
      allOf:
        - { $ref: "#/components/schemas/ExamSettings" }
      minProperties: 1
      unevaluatedProperties: false
    ExamSummary:
      type: object
      required: [id, title, status, state, startsAt, endsAt, durationMinutes, totalMarks, selectionMode, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, COMPLETED], description: Stored lifecycle status. }
        state: { $ref: "#/components/schemas/ExamState" }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        durationMinutes: { $ref: "#/components/schemas/ExamPositiveInt" }
        totalMarks: { $ref: "#/components/schemas/ExamMarks" }
        selectionMode: { type: string, enum: [FIXED, BALANCED] }
        createdAt: { $ref: "#/components/schemas/Instant" }
        updatedAt: { $ref: "#/components/schemas/Instant" }
    ExamSummaryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ExamSummary" }
    ExamPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ExamSummary" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    ExamJoinCode:
      type: string
      pattern: "^[0-9a-f]{32}$"
    ExamDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/ExamSummary" }
            - { $ref: "#/components/schemas/ExamSettings" }
          required: [instructions, questionCount, questions, difficultyRules, rules, joinCode, publishedAt, completedAt, shuffleQuestions, shuffleOptions, multiSelectScoring, maxAttempts, resultPolicy, disputeWindowHours, revealAnswers, desktopOnly, blockClipboard, blockContextMenu, requireFullscreen, detectExtraDisplay, watermark, aiNotice, honeypot]
          properties:
            questionCount: { type: [integer, "null"], minimum: 1, maximum: 500 }
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamPoolRow" }
            difficultyRules:
              type: array
              items: { $ref: "#/components/schemas/ExamDifficultyRule" }
            rules: { $ref: "#/components/schemas/ExamCandidateRules" }
            joinCode:
              oneOf:
                - { $ref: "#/components/schemas/ExamJoinCode" }
                - { type: "null" }
            publishedAt:
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
            completedAt:
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
    ExamCandidateRules:
      type: object
      required: [startsAt, endsAt, durationMinutes, maxAttempts, resultPolicy, selectionMode, multiSelectScoring, totalMarks, statements]
      properties:
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        durationMinutes: { $ref: "#/components/schemas/ExamPositiveInt" }
        maxAttempts: { type: [integer, "null"], minimum: 1 }
        resultPolicy: { type: string, enum: [BEST, LATEST] }
        selectionMode: { type: string, enum: [FIXED, BALANCED] }
        multiSelectScoring: { type: string, enum: [ALL_OR_NOTHING, PARTIAL] }
        totalMarks: { $ref: "#/components/schemas/ExamMarks" }
        statements:
          type: array
          items: { type: string }
    ExamPoolQuestion:
      type: object
      additionalProperties: false
      required: [questionId]
      properties:
        questionId: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        marks:
          oneOf:
            - { $ref: "#/components/schemas/ExamMarks" }
            - { type: "null" }
    ExamPoolRequest:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ExamPoolQuestion" }
    ExamPoolRow:
      type: object
      required: [questionId, marks, position, question]
      properties:
        questionId: { type: string }
        marks:
          oneOf:
            - { $ref: "#/components/schemas/ExamMarks" }
            - { type: "null" }
        position: { type: integer, minimum: 1 }
        question:
          type: object
          required: [difficulty, isArchived]
          properties:
            difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
            isArchived: { type: boolean }
    ExamPoolResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [questions]
          properties:
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamPoolRow" }
    ExamDifficultyRule:
      type: object
      additionalProperties: false
      required: [difficulty, percent, marksEach]
      properties:
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        percent: { type: integer, minimum: 0, maximum: 100 }
        marksEach: { $ref: "#/components/schemas/ExamMarks" }
    ExamDifficultyRulesRequest:
      type: object
      additionalProperties: false
      required: [questionCount, rules]
      properties:
        questionCount: { type: integer, minimum: 1, maximum: 500 }
        rules:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/ExamDifficultyRule" }
    ExamDifficultyRulesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [questionCount, difficultyRules]
          properties:
            questionCount: { type: integer, minimum: 1, maximum: 500 }
            difficultyRules:
              type: array
              items: { $ref: "#/components/schemas/ExamDifficultyRule" }
    ExamReviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [canPublish, errors, warnings, questionCount, paperMarks, difficulty]
          properties:
            canPublish: { type: boolean }
            errors:
              type: array
              items: { $ref: "#/components/schemas/ExamReviewIssue" }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/ExamReviewIssue" }
            questionCount: { type: [integer, "null"], minimum: 0 }
            paperMarks: { type: [number, "null"], minimum: 0 }
            difficulty:
              type: array
              items:
                type: object
                required: [difficulty, available, required, percent, marksEach]
                properties:
                  difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                  available: { type: integer, minimum: 0 }
                  required: { type: integer, minimum: 0 }
                  percent: { type: integer, minimum: 0, maximum: 100 }
                  marksEach: { $ref: "#/components/schemas/ExamMarks" }
    ExamReviewIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    ExamJoinCodeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [joinCode]
          properties:
            joinCode: { $ref: "#/components/schemas/ExamJoinCode" }

    EnrolmentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [candidate, createdAt]
            properties:
              candidate:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { $ref: "#/components/schemas/Email" }
              createdAt: { $ref: "#/components/schemas/Instant" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    EnrolCandidatesRequest:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/Email" }
    EnrolCandidatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [email, status]
            properties:
              email: { $ref: "#/components/schemas/Email" }
              status: { type: string, enum: [ENROLLED, ALREADY_ENROLLED, NOT_A_REGISTERED_CANDIDATE] }

    CreateRetakeGrantRequest:
      type: object
      additionalProperties: false
      required: [candidateId, startsAt, endsAt, reason]
      properties:
        candidateId: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        attemptsAllowed: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
    RetakeGrant:
      type: object
      required: [id, candidateId, startsAt, endsAt, reason, attemptsAllowed, createdAt, revokedAt]
      properties:
        id: { type: string }
        candidateId: { type: string }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        reason: { type: string }
        attemptsAllowed: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/Instant" }
        revokedAt:
          oneOf:
            - { $ref: "#/components/schemas/Instant" }
            - { type: "null" }
    RetakeGrantPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RetakeGrant" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    RetakeGrantResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/RetakeGrant" }

    JoinExamRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: The 32-character hexadecimal code shared by the examiner. }
    JoinExamResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [examId, status]
          properties:
            examId: { type: string }
            status: { type: string, enum: [ENROLLED, ALREADY_ENROLLED] }

    CandidateExamSlot:
      type: object
      required: [retakeGrantId, startsAt, endsAt, attemptsAllowed, attemptsUsed]
      properties:
        retakeGrantId: { type: [string, "null"], description: Null denotes the main slot. }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        attemptsAllowed: { type: [integer, "null"], minimum: 1, description: Null means unlimited. }
        attemptsUsed: { type: integer, minimum: 0 }
    CandidateExam:
      type: object
      required: [id, title, startsAt, endsAt, durationMinutes, status, attemptsUsed, maxAttempts, totalAttemptsUsed, slot, activeAttemptId, deadlineAt]
      properties:
        id: { type: string }
        title: { type: string }
        startsAt: { $ref: "#/components/schemas/Instant" }
        endsAt: { $ref: "#/components/schemas/Instant" }
        durationMinutes: { type: integer, minimum: 1 }
        status: { type: string, enum: [UPCOMING, AVAILABLE, IN_PROGRESS, COMPLETED] }
        attemptsUsed: { type: integer, minimum: 0, description: Attempts used in the main slot. }
        maxAttempts: { type: [integer, "null"], minimum: 1, description: Main slot allowance. Null means unlimited. }
        totalAttemptsUsed: { type: integer, minimum: 0, description: Attempts used across the main and retake slots. }
        slot:
          description: Live, available or upcoming slot. Null once no eligible slot remains.
          oneOf:
            - { $ref: "#/components/schemas/CandidateExamSlot" }
            - { type: "null" }
        activeAttemptId: { type: [string, "null"] }
        deadlineAt:
          oneOf:
            - { $ref: "#/components/schemas/Instant" }
            - { type: "null" }
    CandidateExamPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CandidateExam" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    CandidateExamDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/CandidateExam" }
          required: [instructions, rules, serverTime]
          properties:
            instructions: { type: string }
            rules: { $ref: "#/components/schemas/ExamCandidateRules" }
            serverTime: { $ref: "#/components/schemas/Instant" }

    StartCandidateAttemptRequest:
      type: object
      additionalProperties: false
      required: [rulesAccepted]
      properties:
        rulesAccepted: { const: true }
    CandidateAttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, EXPIRED]
    CandidateAttemptStart:
      type: object
      required: [id, examId, attemptNumber, status, isSandbox, retakeGrantId, deadlineAt, questionCount, serverTime]
      properties:
        id: { type: string }
        examId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/CandidateAttemptStatus" }
        isSandbox: { type: boolean }
        retakeGrantId: { type: [string, "null"] }
        deadlineAt: { $ref: "#/components/schemas/Instant" }
        questionCount: { type: integer, minimum: 0 }
        serverTime: { $ref: "#/components/schemas/Instant" }
    CandidateAttemptStartResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CandidateAttemptStart" }
    CandidateAttemptResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/CandidateAttemptStart" }
          required: [submittedAt, currentPosition, scratchpad, questions]
          properties:
            submittedAt:
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
            currentPosition: { type: integer, minimum: 1 }
            scratchpad: { type: string }
            questions:
              type: array
              items:
                type: object
                required: [position, marks, flagged, answered]
                properties:
                  position: { type: integer, minimum: 1 }
                  marks: { type: number }
                  flagged: { type: boolean }
                  answered: { type: boolean }
    CandidateQuestionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [position, type, text, options, marks, answer, aiNotice, honeypot, deadlineAt, serverTime]
          properties:
            position: { type: integer, minimum: 1 }
            type: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_SELECT, WRITTEN] }
            text: { type: string }
            options:
              type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            marks: { type: number }
            answer:
              type: object
              required: [selectedOptionIds, writtenAnswer, flagged, revision, savedAt, keystrokeCount, pasteCount]
              properties:
                selectedOptionIds:
                  type: array
                  items: { type: string }
                writtenAnswer: { type: [string, "null"] }
                flagged: { type: boolean }
                revision: { type: integer, minimum: 0 }
                savedAt:
                  oneOf:
                    - { $ref: "#/components/schemas/Instant" }
                    - { type: "null" }
                keystrokeCount: { type: integer, minimum: 0 }
                pasteCount: { type: integer, minimum: 0 }
            aiNotice: { type: [string, "null"] }
            honeypot: { type: [string, "null"] }
            deadlineAt: { $ref: "#/components/schemas/Instant" }
            serverTime: { $ref: "#/components/schemas/Instant" }
    SaveCandidateAnswerRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        selectedOptionIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        writtenAnswer: { type: [string, "null"], maxLength: 10000 }
        flagged: { type: boolean }
        keystrokeCount: { type: integer, minimum: 0, maximum: 2147483647 }
        pasteCount: { type: integer, minimum: 0, maximum: 2147483647 }
    SaveCandidateAnswerResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted, revision, savedAt, flagged, answered, serverTime]
          properties:
            accepted: { type: boolean }
            revision: { type: integer, minimum: 0 }
            savedAt:
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
            flagged: { type: boolean }
            answered: { type: boolean }
            serverTime: { $ref: "#/components/schemas/Instant" }
    SaveCandidateScratchpadRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, maxLength: 10000 }
    SaveCandidateScratchpadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [text, serverTime]
          properties:
            text: { type: string }
            serverTime: { $ref: "#/components/schemas/Instant" }
    SubmitCandidateAttemptResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, submittedAt]
          properties:
            id: { type: string }
            status: { type: string, enum: [SUBMITTED, EXPIRED] }
            submittedAt: { $ref: "#/components/schemas/Instant" }

    AuditAction:
      type: string
      description: |
        Known actions so far. More are added with each module, so treat
        unknown values as plain text.
      examples: [LOGIN_FAILED]
      enum:
        - USER_SIGNED_UP
        - LOGIN_SUCCEEDED
        - LOGIN_FAILED
        - LOGOUT
        - PASSWORD_CHANGED
        - USER_CREATED
        - USER_UPDATED
        - USER_SESSIONS_REVOKED
        - USER_SIGN_IN_UNLOCKED
        - ANSWER_GRADED
        - RESULT_RELEASED
        - EXAM_PUBLISHED
        - EXAM_UNPUBLISHED
        - EXAM_COMPLETED
        - RETAKE_GRANTED

    AuditEntry:
      type: object
      required: [id, action, entityType, entityId, metadata, ip, createdAt, actor]
      properties:
        id: { type: string }
        action:
          type: string
          description: See AuditAction for known values.
        entityType: { type: string, description: Kind of record affected. }
        entityId: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Details that depend on the action. Never contains a password.
        ip: { type: [string, "null"], description: Network address of the request. }
        createdAt: { $ref: "#/components/schemas/Instant" }
        actor:
          description: Who did it. Null when there was no signed-in user.
          oneOf:
            - { $ref: "#/components/schemas/SessionUser" }
            - { type: "null" }
