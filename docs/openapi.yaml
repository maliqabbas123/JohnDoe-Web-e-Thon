openapi: 3.1.0

info:
  title: Secure Examination Management System API
  version: 0.7.0
  summary: Backend API for creating, conducting, monitoring and evaluating online examinations.
  description: |
    This document covers the endpoints that are **built and tested**. Planned
    endpoints are listed in `docs/api.md` and are added here as each module ships.
    A test fails the build if an endpoint exists without being described here.

    # Notes for the UI team

    ## Sending requests
    - Base URL is `/api/v1`. Responses use JSON. Requests use JSON unless the operation documents another content type.
    - Authentication is a session cookie named `exam_session`. It is `HttpOnly`,
      so JavaScript cannot read it and you never handle a token yourself.
    - **Always send credentials**: `fetch(url, { credentials: "include" })`, or
      `withCredentials: true` in axios. Without it the cookie is not sent and
      every call returns 401.
    - If the UI is served from a different origin than the API, that origin must
      be listed in the API's `ALLOWED_ORIGINS` setting. Tell the backend team the
      exact origin (scheme, host and port, no trailing slash).
    - State-changing requests (`POST`, `PATCH`, `PUT`, `DELETE`) from an origin
      that is not allowed are refused with `403 FORBIDDEN`.
    - Do not cache responses. Every response is sent with `Cache-Control: no-store`.

    ## Signing in and routing by role
    - There is one sign-in for every user type. Never ask the user for their
      role at sign-in and never send one. Read `data.user.role` from the
      response (or from `GET /auth/me`) and route to the matching area:
      `ADMIN`, `EXAMINER` or `CANDIDATE`.
    - On page load, call `GET /auth/me`. `200` means signed in; `401` means show
      the sign-in page.
    - **One active session per user.** Signing in on another device or browser
      ends the previous session. Any call can therefore start returning `401`
      at any time; handle `401` globally by sending the user to sign-in.
    - A session lasts 8 hours. It also ends at once when an administrator
      changes the user's role, deactivates them or resets their password.
    - Hiding a button is not security. The API enforces every permission; a
      call the user is not allowed to make returns `403`.

    ## Responses
    - Success: `{ "data": ... }`. Lists add `"meta"` with paging information.
    - `204` responses have no body. Do not call `.json()` on them.
    - Failure: `{ "error": { "code", "message", "details"? } }`. Switch on
      `error.code`, not on the message text. `message` is safe to show to users.
    - `422 VALIDATION_FAILED` carries `details: [{ path, message }]`. `path` is
      the field name (for example `email`); show `message` next to that field.
      An empty `path` means the problem is with the request as a whole, most
      often a field the API does not accept.
    - The API rejects fields it does not know. Send only the documented fields.
    - `429 RATE_LIMITED` carries a `Retry-After` header in seconds. Disable the
      form and show a countdown rather than retrying.
    - `500 INTERNAL` never carries detail. Show a generic message.

    ## Data conventions
    - Every time is ISO 8601 in UTC (`2026-11-28T09:00:00.000Z`). Convert to the
      viewer's local time for display only, and send UTC back.
    - For anything timed, use the `serverTime` the API returns, never the
      device clock.
    - Ids are opaque strings. Do not parse them or assume a format.
    - Emails are case-insensitive and returned in lower case.
    - Text may contain any characters, including `<`, `&` and quotes. The API
      stores it unchanged; **the UI must escape it when rendering** and must
      never insert it as raw HTML.

    ## Validating on the client
    Validate in the UI for a better experience, using the same rules the API
    enforces (they are in the schemas below). The API validates again and is
    the authority.

servers:
  - url: /api/v1
    description: Same origin as the UI
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Platform
    description: Service status.
  - name: Auth
    description: Sign-up, sign-in, sign-out and the current user.
  - name: Users
    description: Account management. Administrator only.
  - name: Question bank
    description: An examiner's reusable topics and questions. Examiner only; each examiner sees only their own.
  - name: Admin
    description: Platform oversight. Administrator only. Returns counts and account data, never examination content.

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Service and database status
      description: |
        Public. Use it for an uptime indicator.

        **UI notes:** `serverTime` is the API's clock in UTC; use it to detect a
        device clock that is wrong.
      security: []
      responses:
        "200":
          description: The service can reach its database.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, database, serverTime]
                    properties:
                      status: { type: string, const: ok }
                      database: { type: string, const: up }
                      serverTime: { $ref: "#/components/schemas/Instant" }
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Register as a candidate or examiner
      description: |
        Public. Creates an active account and signs the user in (the session
        cookie is set on the response).

        **UI notes:**
        - Offer exactly two user types, candidate and examiner. An administrator
          account cannot be registered; sending `ADMIN` returns 422.
        - On `201`, the user is already signed in. Route by `data.user.role`;
          do not ask them to sign in again.
        - `409` means the email is already registered. Offer sign-in instead.
        - Limited to 10 attempts per hour per network address; expect `429`.
        - Email addresses are not verified. There is no confirmation email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
            example:
              email: new.examiner@example.org
              name: Noor Examiner
              password: a-long-passphrase
              role: EXAMINER
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in
      description: |
        Public. One endpoint for every user type; the role is read from the
        account.

        **UI notes:**
        - Send only `email` and `password`. Any other field returns 422.
        - `401` is returned with the same message for a wrong password, an
          unknown email and a deactivated account. Show one message, such as
          "Invalid email or password"; do not tell the user which was wrong.
        - After 5 failed attempts for one account within 15 minutes, further
          attempts return `429`, even with the correct password. Show how long
          to wait from `Retry-After`.
        - Signing in ends any other session of the same user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
            example:
              email: candidate@exam.test
              password: Candidate-Demo-2026
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid email or password, or the account is deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: |
        Ends the current session and clears the cookie.

        **UI notes:** no request body. On `204`, clear any user state held in
        memory and go to the sign-in page. A `401` here means the session had
        already ended; treat it the same way.
      responses:
        "204":
          description: Signed out. No body.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The signed-in user
      description: |
        **UI notes:** call this when the application loads to restore the
        signed-in state and to decide which area to show. Do not store the role
        in local storage and trust it later; ask the API.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: |
        **UI notes:**
        - A wrong current password returns `422` with `path: currentPassword`.
        - The new password must differ from the current one.
        - On `204` the user stays signed in on this device. Their other
          sessions are ended.
        - Limited to 5 attempts per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: Password changed. No body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: |
        Administrator only. Newest first.

        **UI notes:**
        - `q` searches name and email, ignoring case. It is literal text: `%`
          and `_` are not wildcards.
        - A page past the end returns an empty `data` array with the same
          `total`, not an error.
        - Debounce the search box; each keystroke is a database query.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: isActive
          in: query
          description: Send the text `true` or `false`.
          schema: { type: string, enum: ["true", "false"] }
        - name: q
          in: query
          description: Text to find in the name or email.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: |
        Administrator only. Unlike sign-up, this can create an administrator.

        **UI notes:** the administrator chooses the first password and must
        pass it to the user by some other means; there is no email. `409` means
        the email is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{id}:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    get:
      tags: [Users]
      operationId: getUser
      summary: Read one user
      description: Administrator only.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's name, role, activation or password
      description: |
        Administrator only. Send only the fields you want to change; at least
        one is required. The email cannot be changed.

        **UI notes:**
        - Changing the role, deactivating, or setting a password signs that
          user out everywhere at once. Warn the administrator before saving.
        - An administrator cannot change their own role or deactivate
          themselves; that returns `409`. Disable those controls on the
          administrator's own row.
        - Deactivated users cannot sign in. Set `isActive: true` to restore.
        - There is no delete. Deactivate instead, so history is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The change would lock the administrator out, or remove the last active administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{id}/activity:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    get:
      tags: [Users]
      operationId: getUserActivity
      summary: Sessions, sign-in history and account changes for one user
      description: |
        Administrator only. Everything for a user detail screen in one call:
        who is signed in, recent sign-in attempts, changes to the account, and
        whether sign-in is currently locked.

        **UI notes:**
        - Use together with `GET /users/{id}` to build the user detail page.
        - `signIns` and `accountChanges` hold at most the 20 newest entries
          each. For older history, use `GET /admin/audit-logs` with
          `entityType=User&entityId={id}`.
        - `sessions` has zero or one entry, because a user has one active
          session at a time. It is an array so the UI does not need changing
          if that rule is ever relaxed.
        - `signInLock.locked` is true after 5 failed sign-ins within 15
          minutes. Show `until` and offer the unlock action.
        - `accountChanges[].metadata` for `USER_UPDATED` holds `{ from, to }`
          pairs per changed field, for example `role`. Use it for a role
          history. A password reset appears as `passwordReset: true`; the
          password itself is never present.
      responses:
        "200":
          description: The user's activity.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UserActivity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/sessions:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    delete:
      tags: [Users]
      operationId: forceSignOut
      summary: Sign a user out everywhere
      description: |
        Administrator only. Ends every session of the user at once. It does not
        deactivate the account or change the password; the user can sign in
        again.

        **UI notes:** no body. Safe to repeat. To keep someone out, deactivate
        the account with `PATCH /users/{id}` instead. If the administrator does
        this to their own account, their next call returns 401.
      responses:
        "204":
          description: Sessions ended. No body.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/sign-in-lock:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    delete:
      tags: [Users]
      operationId: unlockSignIn
      summary: Lift a sign-in lockout
      description: |
        Administrator only. Clears the lock that follows repeated failed
        sign-ins for this account, so the user can try again immediately. The
        password is not changed.

        **UI notes:** no body. Safe to call when nothing is locked. It does not
        lift the separate limit on attempts from one network address.
      responses:
        "204":
          description: Lock lifted. No body.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /topics:
    get:
      tags: [Question bank]
      operationId: listTopics
      summary: List your topics with question counts
      description: |
        Examiner only. Every topic in the examiner's bank, in name order, with
        how many active questions it holds at each difficulty.

        **UI notes:**
        - Not paged; an examiner has a modest number of topics.
        - `byDifficulty` counts exclude archived questions. Use these counts
          when building an exam's difficulty mix, to show whether the bank has
          enough questions.
        - Administrators and candidates receive 403: the question bank is
          examination content.
      responses:
        "200":
          description: The examiner's topics.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TopicWithCounts" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Question bank]
      operationId: createTopic
      summary: Create a topic
      description: |
        Examiner only.

        **UI notes:** names are unique within an examiner's bank, ignoring
        letter case and surrounding spaces; a duplicate returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicRequest" }
      responses:
        "201":
          description: The created topic.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Topic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The examiner already has a topic with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /topics/{id}:
    parameters:
      - { $ref: "#/components/parameters/TopicId" }
    patch:
      tags: [Question bank]
      operationId: renameTopic
      summary: Rename a topic
      description: |
        Examiner only, own topics only.

        **UI notes:** another examiner's topic returns 404, the same as one
        that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicRequest" }
      responses:
        "200":
          description: The renamed topic.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Topic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The examiner already has a topic with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Question bank]
      operationId: deleteTopic
      summary: Delete an empty topic
      description: |
        Examiner only, own topics only.

        **UI notes:** a topic that holds any question, archived or not, cannot
        be deleted and returns 409. Offer to move the questions first.
      responses:
        "204":
          description: Deleted. No body.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The topic still holds questions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /questions:
    get:
      tags: [Question bank]
      operationId: listQuestions
      summary: List your questions
      description: |
        Examiner only. Newest first. Includes the answer key (`isCorrect`).

        **UI notes:**
        - Archived questions are left out unless `isArchived=true` is sent;
          that returns only archived ones. Build "Active" and "Archived" tabs.
        - `q` searches the question text as literal text, ignoring case.
          Debounce the search box.
        - Filters combine: all must match.
        - `usedInExams` tells you how many exams use the question. Show it
          before the examiner edits or removes one.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: topicId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/QuestionType" }
        - name: difficulty
          in: query
          schema: { $ref: "#/components/schemas/Difficulty" }
        - name: isArchived
          in: query
          description: Send `true` to list archived questions instead of active ones.
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: q
          in: query
          description: Text to find in the question.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: One page of questions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Question bank]
      operationId: createQuestion
      summary: Create a question
      description: |
        Examiner only. Options are created with the question, in the order sent.

        **UI notes, answer-key rules by type:**
        - `SINGLE_CHOICE`: 2 to 10 options, exactly one correct.
        - `MULTIPLE_SELECT`: 2 to 10 options, at least one correct.
        - `WRITTEN`: no options. Omit `options` or send an empty array.
        - Option texts must differ from each other, ignoring letter case.
        - A broken rule returns 422 with `path: "options"`. A problem inside
          one option uses a path such as `options.0.text`.

        **Other notes:**
        - `difficulty` is required. Make the examiner choose; do not default it.
        - `defaultMarks` is a number from 0.25 to 1000 with at most two decimal
          places. Send a number, not a string.
        - `topicId` must be one of the examiner's own topics.
        - `explanation` is the model answer or marking guide. It is for the
          examiner and is never shown to candidates by this endpoint.
        - The type cannot be changed later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuestionRequest" }
            example:
              topicId: tpc_123
              type: SINGLE_CHOICE
              difficulty: MEDIUM
              text: What is 2 + 2?
              defaultMarks: 2
              options:
                - { text: "3", isCorrect: false }
                - { text: "4", isCorrect: true }
      responses:
        "201":
          description: The created question.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /questions/{id}:
    parameters:
      - { $ref: "#/components/parameters/QuestionId" }
    get:
      tags: [Question bank]
      operationId: getQuestion
      summary: Read one question
      description: |
        Examiner only, own questions only. Includes the answer key.

        **UI notes:** another examiner's question returns 404. Archived
        questions can still be read.
      responses:
        "200":
          description: The question.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Question" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Question bank]
      operationId: updateQuestion
      summary: Edit, archive or restore a question
      description: |
        Examiner only, own questions only. Send only the fields to change.

        **UI notes:**
        - Sending `options` replaces the whole set; option ids change. Always
          send every option, not just the edited one. The answer-key rules of
          the question's type apply.
        - `type` cannot be changed; sending it returns 422. Create a new
          question instead.
        - Send `explanation: null` to clear it.
        - `isArchived: true` archives, `false` restores.
        - Editing never changes an attempt that has already started: each
          attempt keeps its own copy of the question. Edits do reach exams
          that have not started yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuestionRequest" }
      responses:
        "200":
          description: The updated question.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Question bank]
      operationId: removeQuestion
      summary: Delete an unused question, or archive a used one
      description: |
        Examiner only, own questions only.

        **UI notes:** read `data.outcome`. `DELETED` means the question was
        never used and is gone. `ARCHIVED` means an exam or an attempt uses
        it, so it was archived instead and can be restored. Tell the examiner
        which happened. This returns 200 with a body, not 204.
      responses:
        "200":
          description: What happened to the question.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [outcome]
                    properties:
                      outcome: { type: string, enum: [DELETED, ARCHIVED] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import/questions:
    post:
      tags: [Question bank]
      operationId: importQuestions
      summary: Bulk import questions into your question bank
      description: |
        Examiner only. The job record and valid questions are stored together.
        Each rejected row reports its first error with a row number, field, and
        message. A valid file creates a job even if every row is rejected.

        **UI notes:** Send the UTF-8 file itself as the request body, with
        `text/csv` or `application/json`. A UTF-8 byte order mark is accepted.
        Use `fileName` to preserve the original name in history. Each file
        can contain 1–100 questions and use at most 512 KiB (524,288 bytes).
        Each examiner can submit 10 uploads per 60-second window.

        - JSON is an array of the same objects used by `POST /questions`.
          Row 1 is the first array item.
        - CSV must start with the exact header shown in the example. Row 2
          is the first record after the header. A quoted cell may contain
          commas and line breaks, and doubled quotes escape a literal quote.
          A line break inside a quoted cell does not advance the row number.
          Use a decimal for `defaultMarks` and leave `explanation` blank if
          omitted. For objective questions, put a JSON array of
          `{text,isCorrect}` objects in the `options` column and CSV-escape
          its quotes. For written questions, leave `options` blank.
          See the [example file](examples/question-import.csv).
        - Replace the placeholder topic in the example with the ID of one
          of the signed-in examiner's topics from `GET /topics`. Unknown
          topics and other examiners' topics get the same row error.
        - A duplicate of an earlier valid row in the same file is rejected.
          Importing the same file again creates a separate job and questions.
          After a partial import, resubmit only corrected rows.
        - On 201 display the counts and row errors, then refresh history and
          the question bank. On 400, 403, 413 or 422 the file created no job
          and changed no questions. Use the retry countdown on 429.
      parameters:
        - in: query
          name: fileName
          description: Original file name without path separators or control characters. Defaults to questions.csv or questions.json.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: "#/components/schemas/CreateQuestionRequest" }
            example:
              - { topicId: replace-with-your-topic-id, type: WRITTEN, difficulty: HARD, text: Explain how you solved it., defaultMarks: 2 }
          text/csv:
            schema: { type: string }
            example: |
              topicId,type,difficulty,text,explanation,defaultMarks,options
              replace-with-your-topic-id,SINGLE_CHOICE,EASY,"What is 2 + 2?",,1,"[{""text"":""3"",""isCorrect"":false},{""text"":""4"",""isCorrect"":true}]"
              replace-with-your-topic-id,WRITTEN,HARD,"Explain how you solved it, and show your working.",,2,
      responses:
        "201":
          description: The recorded import outcome, including any rejected rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /import/jobs:
    get:
      tags: [Question bank]
      operationId: listImportJobs
      summary: List your past imports
      description: |
        Examiner only. Returns only your import jobs, newest first.

        **UI notes:** Display each job's counts and expand its `errors` list
        for per-row feedback. Request the next page using only the
        `meta.nextCursor` from the previous response as `cursor`. A null
        cursor means the end of the history.
      parameters:
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: An import history page with row errors.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ImportJob" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/overview:
    get:
      tags: [Admin]
      operationId: getPlatformOverview
      summary: Platform-wide counts
      description: |
        Administrator only. Counts for a dashboard: users, examinations,
        attempts, open disputes, active sessions and failed sign-ins.

        **UI notes:**
        - Every value is a number except `serverTime`. There are no names or
          examination details here by design.
        - `exams.ongoing` and `exams.upcoming` are subsets of `exams.published`.
          Do not add them to it.
        - `attempts.interrupted` is a subset of `attempts.inProgress`.
        - Refresh on a timer of 30 seconds or more, not faster.
      responses:
        "200":
          description: Current counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlatformOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Audit log
      description: |
        Administrator only. A read-only record of sensitive actions, newest
        first. Entries cannot be created, changed or removed through the API.

        **UI notes:**
        - `actor` is `null` for actions with no signed-in user, such as a
          failed sign-in for an unknown email.
        - `metadata` differs by action. Render it as key and value pairs rather
          than assuming fields. It never contains a password.
        - `from` and `to` must be full ISO 8601 times **with a time zone**
          (`2026-11-27T00:00:00Z` or `...+05:00`). A date alone returns 422.
        - `action` is matched exactly, ignoring case.
        - **Paging is by cursor, not page number**, because the log grows
          without bound. Request the first page with no `cursor`. To load more,
          send `meta.nextCursor` back as `cursor` with the same filters.
          `nextCursor: null` means there is nothing more. Build a "Load more"
          button or infinite scroll, not numbered pages; you cannot jump to
          page N.
        - `meta.total` is absent unless you send `withTotal=true`, and then it
          comes on the first page only. Counting is the slowest part of the
          request, so ask for it only if the screen shows a result count, and
          keep the value in state while loading more.
        - Treat the cursor as opaque. Do not build or change one.
      parameters:
        - name: cursor
          in: query
          description: The `meta.nextCursor` value from the previous page. Omit for the first page.
          schema: { type: string, maxLength: 200 }
        - { $ref: "#/components/parameters/PageSize" }
        - name: withTotal
          in: query
          description: Send `true` to receive `meta.total` on the first page.
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: actorId
          in: query
          description: Id of the user who performed the action.
          schema: { type: string, maxLength: 64 }
        - name: action
          in: query
          description: Action name, for example `LOGIN_FAILED`.
          schema: { $ref: "#/components/schemas/AuditAction" }
        - name: entityType
          in: query
          description: Kind of record affected, for example `User`.
          schema: { type: string, maxLength: 64 }
        - name: entityId
          in: query
          description: Id of the record affected.
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: Earliest time, inclusive.
          schema: { $ref: "#/components/schemas/Instant" }
        - name: to
          in: query
          description: Latest time, inclusive. Must not be before `from`.
          schema: { $ref: "#/components/schemas/Instant" }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  meta: { $ref: "#/components/schemas/CursorMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: exam_session
      description: Set by sign-in and sign-up. Sent automatically by the browser when requests include credentials.

  headers:
    SessionCookie:
      description: >-
        The session cookie: `exam_session=<token>; HttpOnly; Path=/; Expires=<8 hours>`,
        with `Secure` in production. `SameSite` is `Lax`, or `None` when the API
        is configured for a UI on another origin.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer, minimum: 1 }

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: id
      in: path
      required: true
      description: The user's id.
      schema: { type: string, maxLength: 64 }
    TopicId:
      name: id
      in: path
      required: true
      description: The topic's id.
      schema: { type: string, maxLength: 64 }
    QuestionId:
      name: id
      in: path
      required: true
      description: The question's id.
      schema: { type: string, maxLength: 64 }

  responses:
    BadRequest:
      description: The body is not valid JSON, is empty, or the request contains an invalid character.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: No valid session. Send the user to sign-in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: UNAUTHENTICATED, message: Sign in to continue. }
    Forbidden:
      description: The signed-in user's role does not allow this, or the request came from an origin that is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to do this. }
    ForbiddenOrigin:
      description: The request came from an origin that is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record, or it is not visible to this user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request exceeds the byte or row limit for this operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: One or more fields are invalid, or the request has a field the API does not accept.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Some fields are invalid.
              details:
                - { path: email, message: Enter a valid email address. }
    RateLimited:
      description: Too many attempts. Wait for the number of seconds in `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Instant:
      type: string
      format: date-time
      description: ISO 8601 time in UTC.
      examples: ["2026-11-27T08:30:00.000Z"]

    Role:
      type: string
      enum: [ADMIN, EXAMINER, CANDIDATE]
      description: The user type. Decides which area of the UI the user sees.

    Email:
      type: string
      format: email
      maxLength: 254
      description: Case-insensitive. Surrounding spaces are removed and it is stored in lower case.

    Name:
      type: string
      minLength: 1
      maxLength: 120
      description: Display name. Surrounding spaces are removed; it cannot be blank.

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      format: password
      description: 8 to 128 characters. There are no rules about character types; length is what matters.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - VALIDATION_FAILED
                - RATE_LIMITED
                - INTERNAL
              description: Stable identifier. Switch on this, not on the message.
            message:
              type: string
              description: Safe to show to the user.
            details:
              type: array
              description: Present for VALIDATION_FAILED.
              items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Field name. Empty when the problem is with the request as a whole.
        message:
          type: string

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          minimum: 0
          description: Number of items matching the filters, across all pages.

    CursorMeta:
      type: object
      required: [pageSize, nextCursor]
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        nextCursor:
          type: [string, "null"]
          description: Send as `cursor` to get the next page. Null when there are no more items.
        total:
          type: integer
          minimum: 0
          description: Number of items matching the filters. Present only on the first page, and only when `withTotal=true` was sent.

    SessionUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, expiresAt]
          properties:
            user: { $ref: "#/components/schemas/SessionUser" }
            expiresAt:
              allOf: [{ $ref: "#/components/schemas/Instant" }]
              description: When the session ends if nothing ends it sooner.

    User:
      type: object
      required: [id, email, name, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        isActive:
          type: boolean
          description: False means the user cannot sign in.
        createdAt: { $ref: "#/components/schemas/Instant" }
        updatedAt: { $ref: "#/components/schemas/Instant" }

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        password: { $ref: "#/components/schemas/NewPassword" }
        role:
          type: string
          enum: [CANDIDATE, EXAMINER]
          description: Upper case. ADMIN is not accepted.

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 128, format: password }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, format: password }
        newPassword: { $ref: "#/components/schemas/NewPassword" }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, role, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }
        password: { $ref: "#/components/schemas/NewPassword" }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        password:
          allOf: [{ $ref: "#/components/schemas/NewPassword" }]
          description: Sets a new password for the user and signs them out everywhere.

    PlatformOverview:
      type: object
      required: [serverTime, users, exams, attempts, disputes, sessions, security]
      properties:
        serverTime: { $ref: "#/components/schemas/Instant" }
        users:
          type: object
          required: [total, active, inactive, administrators, examiners, candidates]
          properties:
            total: { type: integer }
            active: { type: integer }
            inactive: { type: integer }
            administrators: { type: integer }
            examiners: { type: integer }
            candidates: { type: integer }
        exams:
          type: object
          required: [draft, published, upcoming, ongoing, completed]
          properties:
            draft: { type: integer }
            published: { type: integer }
            upcoming: { type: integer, description: Published and not yet started. Included in published. }
            ongoing: { type: integer, description: Published and inside its time slot now. Included in published. }
            completed: { type: integer }
        attempts:
          type: object
          required: [inProgress, interrupted, submitted, expired]
          properties:
            inProgress: { type: integer }
            interrupted: { type: integer, description: In progress with no recent contact. Included in inProgress. }
            submitted: { type: integer }
            expired: { type: integer, description: Closed by the server at the deadline. }
        disputes:
          type: object
          required: [open]
          properties:
            open: { type: integer }
        sessions:
          type: object
          required: [active]
          properties:
            active: { type: integer, description: Users signed in right now. }
        security:
          type: object
          required: [failedSignInsLast24Hours]
          properties:
            failedSignInsLast24Hours: { type: integer }

    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_SELECT, WRITTEN]
      description: One correct option, one or more correct options, or a written response graded by the examiner.

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
      description: The examiner's label. Used to build papers of equal difficulty.

    Marks:
      type: number
      minimum: 0.25
      maximum: 1000
      multipleOf: 0.01
      description: A number with at most two decimal places.

    Topic:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { $ref: "#/components/schemas/Instant" }

    TopicWithCounts:
      allOf:
        - { $ref: "#/components/schemas/Topic" }
        - type: object
          required: [questionCount, byDifficulty]
          properties:
            questionCount: { type: integer, description: Active questions in the topic. }
            byDifficulty:
              type: object
              required: [EASY, MEDIUM, HARD]
              properties:
                EASY: { type: integer }
                MEDIUM: { type: integer }
                HARD: { type: integer }

    TopicRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    QuestionOption:
      type: object
      required: [id, text, isCorrect, position]
      properties:
        id: { type: string }
        text: { type: string }
        isCorrect: { type: boolean, description: Part of the answer key. Examiner only. }
        position: { type: integer, minimum: 1, description: Authoring order, starting at 1. }

    OptionInput:
      type: object
      additionalProperties: false
      required: [text, isCorrect]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        isCorrect: { type: boolean }

    Question:
      type: object
      required: [id, type, difficulty, text, explanation, defaultMarks, isArchived, createdAt, updatedAt, topic, options, usedInExams]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/QuestionType" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, description: May contain any characters. Escape it when rendering. }
        explanation: { type: [string, "null"], description: Model answer or marking guide. }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        isArchived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Instant" }
        updatedAt: { $ref: "#/components/schemas/Instant" }
        topic:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        options:
          type: array
          description: In authoring order. Empty for a written-response question.
          items: { $ref: "#/components/schemas/QuestionOption" }
        usedInExams: { type: integer, description: Number of exams whose pool includes this question. }

    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [topicId, type, difficulty, text, defaultMarks]
      properties:
        topicId: { type: string, maxLength: 64 }
        type: { $ref: "#/components/schemas/QuestionType" }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, minLength: 1, maxLength: 5000 }
        explanation: { type: [string, "null"], maxLength: 5000 }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        options:
          type: array
          maxItems: 10
          description: Required for choice questions (2 to 10). Omit for written-response questions.
          items: { $ref: "#/components/schemas/OptionInput" }

    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topicId: { type: string, maxLength: 64 }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        text: { type: string, minLength: 1, maxLength: 5000 }
        explanation: { type: [string, "null"], maxLength: 5000 }
        defaultMarks: { $ref: "#/components/schemas/Marks" }
        options:
          type: array
          maxItems: 10
          description: Replaces the whole option set.
          items: { $ref: "#/components/schemas/OptionInput" }
        isArchived: { type: boolean }

    ImportJob:
      type: object
      additionalProperties: false
      required: [id, kind, fileName, totalRows, successCount, failureCount, errors, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [QUESTIONS, CANDIDATES] }
        fileName: { type: string }
        totalRows: { type: integer, minimum: 1 }
        successCount: { type: integer, minimum: 0 }
        failureCount: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, field, message]
            properties:
              row: { type: integer, minimum: 1 }
              field: { type: string, examples: [topicId, options.0.text, row] }
              message: { type: string }
        createdAt: { $ref: "#/components/schemas/Instant" }

    UserActivity:
      type: object
      required: [sessions, signInLock, signIns, accountChanges]
      properties:
        sessions:
          type: array
          description: Active sessions, newest first. Never includes the session token.
          items:
            type: object
            required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent]
            properties:
              id: { type: string }
              createdAt: { $ref: "#/components/schemas/Instant" }
              lastSeenAt:
                allOf: [{ $ref: "#/components/schemas/Instant" }]
                description: Last request made with this session, accurate to about a minute.
              expiresAt: { $ref: "#/components/schemas/Instant" }
              ip: { type: [string, "null"] }
              userAgent: { type: [string, "null"], description: Browser identification. Show it as plain text. }
        signInLock:
          type: object
          required: [locked, until]
          properties:
            locked: { type: boolean }
            until:
              description: When the lock ends by itself. Null when not locked.
              oneOf:
                - { $ref: "#/components/schemas/Instant" }
                - { type: "null" }
        signIns:
          type: array
          description: The 20 most recent sign-in attempts, newest first.
          items:
            type: object
            required: [id, succeeded, ip, createdAt]
            properties:
              id: { type: string }
              succeeded: { type: boolean }
              ip: { type: [string, "null"] }
              createdAt: { $ref: "#/components/schemas/Instant" }
        accountChanges:
          type: array
          description: The 20 most recent changes to the account, newest first.
          items:
            type: object
            required: [id, action, metadata, ip, createdAt, actor]
            properties:
              id: { type: string }
              action: { type: string, description: See AuditAction. }
              metadata: { type: [object, "null"], additionalProperties: true }
              ip: { type: [string, "null"] }
              createdAt: { $ref: "#/components/schemas/Instant" }
              actor:
                description: Who made the change. The user themselves for sign-up and password change.
                oneOf:
                  - { $ref: "#/components/schemas/SessionUser" }
                  - { type: "null" }

    AuditAction:
      type: string
      description: |
        Known actions so far. More are added with each module, so treat
        unknown values as plain text.
      examples: [LOGIN_FAILED]
      enum:
        - USER_SIGNED_UP
        - LOGIN_SUCCEEDED
        - LOGIN_FAILED
        - LOGOUT
        - PASSWORD_CHANGED
        - USER_CREATED
        - USER_UPDATED
        - USER_SESSIONS_REVOKED
        - USER_SIGN_IN_UNLOCKED

    AuditEntry:
      type: object
      required: [id, action, entityType, entityId, metadata, ip, createdAt, actor]
      properties:
        id: { type: string }
        action:
          type: string
          description: See AuditAction for known values.
        entityType: { type: string, description: Kind of record affected. }
        entityId: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Details that depend on the action. Never contains a password.
        ip: { type: [string, "null"], description: Network address of the request. }
        createdAt: { $ref: "#/components/schemas/Instant" }
        actor:
          description: Who did it. Null when there was no signed-in user.
          oneOf:
            - { $ref: "#/components/schemas/SessionUser" }
            - { type: "null" }
