          description: Autosave answer fields or a review flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveCandidateAnswerResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
