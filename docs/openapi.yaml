    get:
      tags: [Attempts]
      operationId: getCandidateAttemptQuestion
      summary: Open one question on the paper
      description: |
        **UI notes:** Display the returned question and restore its saved answer and revision. Use this endpoint for navigation, as opening a different position records server-side timing. Display aiNotice when present and apply the hidden marker instruction when honeypot is present. On 409, show the closed attempt state.
