name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam_ci
          POSTGRES_DB: exam_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam -d exam_system_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # A throwaway database that exists only for this job.
      DATABASE_URL: postgresql://exam:exam_ci@localhost:5432/exam_system_test?schema=public
      E2E_DATABASE_URL: postgresql://exam:exam_ci@localhost:5432/exam_system_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Applies migrations, seeds the test accounts, builds the application,
      # starts it and runs every end-to-end test against it.
      - name: Build and end-to-end tests
        run: npm run test:e2e
